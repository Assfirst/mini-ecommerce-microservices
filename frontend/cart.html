<!DOCTYPE html>
<html lang="th" data-theme="cupcake"> <!-- ใช้ Theme เดียวกับ products.html -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAGKID - ตะกร้าสินค้า</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.11.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <!-- SweetAlert2 CSS & JS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts & Custom Styles -->
    <style> body { font-family: 'Kanit', sans-serif; } input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; } input[type=number] { -moz-appearance: textfield; } </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Favicon Link -->
    <link rel="icon" type="image/png" href="spen.png" />
</head>
<body class="bg-base-200 text-base-content min-h-screen flex flex-col">

    <!-- Navbar (เหมือน products.html) -->
    <nav class="navbar bg-base-100 shadow-md sticky top-0 z-50 px-2 sm:px-4">
        <div class="flex-1">
            <a href="index.html" class="btn btn-ghost text-lg sm:text-xl normal-case px-1 sm:px-2">
                <img src="spen.png" alt="CHAGKID Logo" class="inline-block h-6 sm:h-8 w-auto mr-2">CHAGKID
            </a>
           
        </div>
        <div class="flex-none gap-1 sm:gap-2">
             <span id="user-info" class="text-xs sm:text-sm font-semibold hidden lg:inline mr-2"></span>
             <a href="admin.html" id="admin-link" class="hidden btn btn-xs btn-outline btn-secondary">แอดมิน</a>
             <button id="logout-button" class="hidden btn btn-sm btn-error text-xs sm:text-sm">ออกจากระบบ</button>
             <a href="products.html" class="btn btn-ghost btn-circle ml-1" title="กลับไปหน้าร้าน"> <!-- <<< เปลี่ยนไอคอนตะกร้าเป็นปุ่มกลับ -->
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
             </a>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="container mx-auto mt-4 sm:mt-8 p-2 sm:p-4 flex-grow">
        <h1 class="text-2xl sm:text-3xl font-bold text-center mb-6 sm:mb-8">ตะกร้าสินค้าของคุณ</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 sm:gap-8">

            <!-- Cart Items Section -->
            <div class="lg:col-span-2 bg-base-100 p-4 sm:p-6 rounded-lg shadow-xl">
                <div id="cart-items-container">
                    <!-- Cart loading placeholder -->
                    <div id="cart-loading" class="text-center py-10">
                        <span class="loading loading-spinner loading-lg text-primary"></span>
                        <p class="mt-2 text-lg">กำลังโหลดรายการในตะกร้า...</p>
                    </div>
                    <!-- Cart items will be inserted here by cart.js -->
                    <!-- Example Item Structure (for reference, will be generated by JS)
                    <div class="cart-item flex items-center border-b border-base-300 py-3 gap-3 sm:gap-4">
                        <img src="https://via.placeholder.com/80" alt="Product Name" class="w-16 h-16 sm:w-20 sm:h-20 object-cover rounded">
                        <div class="flex-grow">
                            <h3 class="font-semibold text-sm sm:text-base">Product Name</h3>
                            <p class="text-xs sm:text-sm text-base-content/70">฿1,250.00</p>
                        </div>
                        <div class="flex items-center gap-1 sm:gap-2">
                            <button class="btn btn-xs btn-outline btn-square">-</button>
                            <input type="number" value="1" min="1" class="input input-bordered input-xs w-12 text-center">
                            <button class="btn btn-xs btn-outline btn-square">+</button>
                        </div>
                        <p class="font-semibold w-20 sm:w-24 text-right text-sm sm:text-base">฿1,250.00</p>
                        <button class="btn btn-xs btn-ghost btn-circle text-error">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                    </div>
                    -->
                </div>
                <div id="cart-empty-message" class="text-center py-10 text-gray-500 hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-2 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                    ตะกร้าของคุณว่างเปล่า ไปเลือกซื้อสินค้ากัน!
                    <a href="products.html" class="btn btn-primary btn-sm mt-4">เลือกซื้อสินค้า</a>
                </div>
            </div>

            <!-- Cart Summary Section -->
            <div class="lg:col-span-1 bg-base-100 p-4 sm:p-6 rounded-lg shadow-xl h-fit sticky top-24"> <!-- h-fit sticky ทำให้ตามลงมา -->
                <h2 class="text-lg sm:text-xl font-semibold mb-4 border-b pb-2">สรุปรายการสั่งซื้อ</h2>
                <div class="space-y-2 text-sm sm:text-base">
                    <div class="flex justify-between">
                        <span>ราคารวม (สินค้า <span id="summary-item-count">0</span> ชิ้น):</span>
                        <span id="summary-subtotal">฿0.00</span>
                    </div>
                    <div class="flex justify-between">
                        <span>ค่าจัดส่ง:</span>
                        <span id="summary-shipping" class="text-success">ฟรี</span> <!-- หรือคำนวณ -->
                    </div>
                   
                    <div class="flex justify-between font-bold text-base sm:text-lg border-t pt-2 mt-4">
                        <span>ยอดรวมสุทธิ:</span>
                        <span id="summary-total">฿0.00</span>
                    </div>
                </div>
                <button id="checkout-button" class="btn btn-primary w-full mt-6" disabled>
                    ดำเนินการสั่งซื้อ
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="footer footer-center p-4 bg-base-300 text-base-content mt-auto">
        <aside> <p>© 2025 CHAGKID - สงวนลิขสิทธิ์ของ CHAGKID By CHAKRON</p>
    </footer>

    <!-- เรียกใช้ JavaScript ของหน้านี้ -->
    <script src="cart.js"></script>
</body>
</html>
